<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ciglet WASM real cepstrum verification</title>
<body>
<pre id="result" data-status="pending">Running actual browser checks.</pre>
<script type="module">
import init, * as api from '/bindings/ciglet_rs.js';
import { verifyRealCepstrumBindings } from '/tests/wasm_real_cepstrum_checks.mjs';
const output = document.getElementById('result');
try {
    await init();
    const result = await verifyRealCepstrumBindings(api, async name => {
        const response = await fetch('/tests/fixtures/' + name);
        if (!response.ok) throw new Error('Fixture request failed: ' + name);
        return new Uint8Array(await response.arrayBuffer());
    });
    output.dataset.status = 'passed'; output.textContent = 'Ciglet real cepstrum actual browser: ' + JSON.stringify(result);
} catch (error) { output.dataset.status = 'failed'; output.textContent = String(error?.stack ?? error); }
</script>
</body>
</html>
