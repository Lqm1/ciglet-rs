[package]
publish = false
name = "ciglet-rs-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native Node.js bindings for ciglet-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false, features = ["std"] }
ciglet-rs = { path = "../ciglet-rs", version = "0.1.0" }
napi = { version = "3.14", default-features = false, features = ["napi8"] }
napi-derive = "3.6"

[build-dependencies]
napi-build = "2.6"
