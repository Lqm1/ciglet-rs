[package]
name = "ciglet-rs"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Lqm1/ciglet-rs"
rust-version = "1.94"


description = "Signal processing and audio analysis compatible with ciglet"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false, features = ["std"] }
rustfft = "6.4.1"
