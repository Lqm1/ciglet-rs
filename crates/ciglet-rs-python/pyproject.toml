[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
readme = "README.md"
name = "ciglet-rs"
dynamic = ["version"]
description = "Native Python bindings for ciglet-rs"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "ciglet_rs._ciglet_rs"
