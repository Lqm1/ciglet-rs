[package]
name = "ciglet-rs-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native Python bindings for ciglet-rs"

[lib]
crate-type = ["cdylib", "rlib"]
name = "_ciglet_rs"

[dependencies]
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false, features = ["std"] }
ciglet-rs = { path = "../ciglet-rs", version = "0.1.0" }
pyo3 = { version = "0.29.3", features = ["multiple-pymethods"] }
